<div class="space-y-6 pt-1 pb-4">
  <app-admin-statistics-filters
    [latestReportedAt]="latestReportedAt()"
    [dateFrom]="dateFrom()"
    [categoryFilter]="categoryFilter()"
    [locationFilter]="locationFilter()"
    [uniqueCategories]="uniqueCategories()"
    (dateFromChange)="setDateFrom($event)"
    (categoryFilterChange)="setCategory($event)"
    (locationFilterChange)="setLocation($event)"
    (clear)="clearFilters()"
  />

  @if (error()) {
    <div class="flex items-center justify-between gap-3 rounded-xl border border-error/30 bg-[var(--color-surface)] px-4 py-3 text-sm text-error">
      <span>{{ error() }}</span>
      <button
        type="button"
        (click)="loadStatistics()"
        class="rounded-lg border border-error/30 px-3 py-1.5 font-semibold transition-colors hover:bg-error/10"
      >
        Retry
      </button>
    </div>
  }

  @if (loading()) {
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
      @for (_ of [1,2,3,4]; track $index) {
        <div class="animate-pulse rounded-2xl border border-border/60 bg-[var(--color-surface)] p-5 shadow-sm">
          <div class="h-3 w-24 rounded bg-[var(--color-surface-2)]"></div>
          <div class="mt-4 h-8 w-20 rounded bg-[var(--color-surface-2)]"></div>
          <div class="mt-3 h-3 w-36 rounded bg-[var(--color-surface-2)]"></div>
        </div>
      }
    </div>
  }

  @if (!loading() && !error()) {
    <div class="pt-2">
      <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-5">
        <app-admin-metric-card
          label="Total Reported"
          [value]="totalReported()"
          hint="Items in the current analytics view"
          tone="default"
        />

        <app-admin-metric-card
          label="Active"
          [value]="activeCount()"
          hint="Still in the active operational pipeline"
          tone="info"
          valueClass="text-info"
        />

        <app-admin-metric-card
          label="Validated"
          [value]="validatedCount()"
          hint="Approved and available to claim"
          tone="success"
          valueClass="text-success"
        />

        <app-admin-metric-card
          label="Returned"
          [value]="returnedCount()"
          hint="Successfully resolved"
          tone="primary"
          valueClass="text-primary"
        />

        <app-admin-metric-card
          label="Recovery Rate"
          [value]="recoveryRate() + '%'"
          hint="Share of reported items marked returned"
          tone="warning"
          valueClass="text-warning"
        />
      </div>
    </div>

    <div class="pt-2">
      <app-admin-statistics-charts
        [totalReported]="totalReported()"
        [statusBars]="statusBars()"
        [statusPieSlices]="statusPieSlices()"
        [activityPoints]="activityPoints()"
        [activityLinePath]="activityLinePath()"
        [activityAreaPath]="activityAreaPath()"
        [activityMaxValue]="activityMaxValue()"
        [activityYAxis]="activityYAxis()"
      />
    </div>

    <div class="pt-2">
      <app-admin-statistics-summary
        [returnedCount]="returnedCount()"
        [archivedCount]="archivedCount()"
        [totalReported]="totalReported()"
        [topLocations]="topLocations()"
        [topCategories]="topCategories()"
      />
    </div>
  }
</div>
